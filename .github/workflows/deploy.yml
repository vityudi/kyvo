name: Deploy to EC2

# Builda a imagem Docker no runner do GitHub (mais RAM que a EC2 de producao,
# que e um t3.micro e travava fazendo esse build localmente) e publica no
# GHCR. O deploy so faz a EC2 puxar a imagem pronta e subir os containers -
# nao compila nada na maquina de producao.
# apps/api/.env fica so no servidor (fora do git), entao o "git reset --hard"
# no deploy nunca toca nos segredos de producao.
on:
  push:
    branches: [main]

concurrency:
  group: deploy-production
  cancel-in-progress: false

env:
  IMAGE: ghcr.io/${{ github.repository_owner }}/kyvo-app

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ${{ env.IMAGE }}:latest
            ${{ env.IMAGE }}:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_SSH_KEY }}
          command_timeout: 15m
          script: |
            set -e
            cd ~/kyvo
            git fetch origin main
            git reset --hard origin/main
            sudo docker compose --env-file apps/api/.env pull
            sudo docker compose --env-file apps/api/.env up -d
            sudo docker image prune -f

      - name: Health check
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_SSH_KEY }}
          script: |
            sleep 5
            # "app" nao publica porta pro host (so o "caddy" fala com ele),
            # entao o check roda de dentro do proprio container.
            sudo docker exec kyvo-app-1 wget -qO- http://127.0.0.1:3000/health || (echo "health check falhou" && exit 1)
